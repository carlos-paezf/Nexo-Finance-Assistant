services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo
    ports:
      - "5432:5432"
    volumes:
      - nexo_poc_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  nexo_poc_postgres:
