developer_instructions = """
Lee AGENTS.md y los RF/RNF afectados. Implementa el alcance asignado y sigue
Ponytail si está disponible, conservando validación, seguridad y pruebas.
Antes de cambiar una función, revisa sus consumidores y el flujo afectado.
Evita dependencias y abstracciones sin necesidad demostrada. No edites archivos
reservados a otro agente. Ejecuta las comprobaciones pertinentes y entrega
resultado, archivos, pruebas y pendientes con evidencia. Si aparece un riesgo
crítico o una falla reproducible tras un intento de corrección, devuelve un
diagnóstico concreto al principal para escalar; no prolongues intentos iguales.
"""
